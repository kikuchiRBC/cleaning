*{box-sizing:border-box}body{text-align:center;font-family:sans-serif;background:url("images/clean.jpg") center/cover fixed no-repeat;margin:0;min-height:100vh;overflow-x:hidden}h1{border-radius:12px;background:linear-gradient(45deg,#87ebff,#69dce9);color:#fff;font-size:2.5rem;text-shadow:2px 2px 5px #0005;margin:20px 10px;padding:8px}h2{display:inline-block;max-width:90%;padding:15px 25px;margin:15px 0;color:#fff;font-size:26px;background:#008cff40;border:2px solid #ffffff4d;border-radius:20px;box-shadow:0 0 15px #00c3ff80;text-shadow:0 0 5px #fff,0 0 10px #00c6ff}.intro-box{max-width:800px;margin:10px auto;padding:10px;background:#ffffffe6;border-radius:20px;border:3px solid #69dce9;box-shadow:0 6px 20px #0002;font-size:13px;line-height:2;font-weight:bold;color:#003366}.container{padding:15px 15px 260px;width:95%;max-width:1000px;margin:20px auto;position:relative;z-index:100;background:#ffffff99;border-radius:15px}#quiz{width:600px;max-width:90%;margin:30px auto;background:#29e6fff2;border-radius:25px;padding:30px;box-shadow:0 10px 30px #0004}#questionText{font-size:30px;font-weight:bold;line-height:2;color:#003366;margin:20px}#toolImage{display:block;margin:20px auto;width:100%;max-width:250px;height:auto}#scoreBoard{position:fixed;top:15px;right:20px;background:#ffffffe6;border-radius:15px;padding:15px 25px;box-shadow:0 8px 20px #0003;font-size:22px;font-weight:bold;z-index:9999}#count{color:#002b74;font-size:24px;font-weight:bold;margin-bottom:10px}#result{font-size:28px;font-weight:bold;margin:25px;color:red}button{width:90%;max-width:320px;min-height:60px;margin:10px;padding:15px;font-size:20px;font-weight:bold;border:0;border-radius:12px;background:linear-gradient(45deg,#126798,#729aff);color:#fff;cursor:pointer;transition:.3s}button:hover{transform:translateY(-3px);box-shadow:0 8px 20px #0005}button:disabled{opacity:.5;cursor:not-allowed}.random-btn{background:linear-gradient(45deg,#c5bfff,#a79fff)!important}#next,#nextSet{width:260px;background:linear-gradient(45deg,#00c853,#64dd17)}.home-btn{position:fixed;top:50%;right:18px;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:9999}.home-btn a{width:58px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#00bcd4,#2196f3);color:#fff;border-radius:50%;text-decoration:none;box-shadow:0 5px 15px #0004}.home-btn a span{font-size:10px;line-height:1;margin-top:2px;font-weight:bold}.floating-close-btn{position:fixed;top:100px;right:20px;width:auto;min-height:auto;padding:12px 20px;background:linear-gradient(45deg,#ff5252,#ff1744);color:#fff;border-radius:50px;z-index:99999}.animated-wave-section{position:fixed;left:0;bottom:0;width:100%;height:250px;overflow:hidden;z-index:1;pointer-events:none}.animated-wave{position:absolute;bottom:-50px;left:0;width:200%;height:180%;animation:wave-animation 10s linear infinite}.animated-wave path{fill:#00bcd4}@keyframes wave-animation{from{transform:translateX(0)}to{transform:translateX(-50%)}}.bubble-background{position:fixed;inset:0;overflow:hidden;z-index:5;pointer-events:none}.bubble{position:absolute;bottom:-50px;border:2px solid #ffffffb3;background:#ffffff26;border-radius:50%;animation:bubble 12s linear infinite}@keyframes bubble{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-100vh);opacity:0}}.fall-emoji{position:fixed;top:-50px;font-size:40px;z-index:99999;pointer-events:none;animation:fallDown linear forwards}@keyframes fallDown{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(calc(100vh + 100px)) rotate(720deg);opacity:0}}
#sortableImages{width:100%;max-width:520px;margin:15px auto}.sort-item{background:#fff;border:3px solid #90caf9;border-radius:15px;margin:12px auto;padding:10px;cursor:grab;box-shadow:0 4px 10px #0002}
.sort-item img{
  width:180px;
  max-width:100%;
  height:auto;
  display:block;
  margin:auto;
  pointer-events:none;
  user-select:none;

  border:6px solid #1976d2;
  border-radius:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  background:#fff;
}
.sort-item{
  background:#fff;
  border:4px solid #90caf9;
  border-radius:15px;
  margin:12px auto;
  padding:10px;
  cursor:grab;
  box-shadow:0 4px 10px #0002;
}

.sortable-chosen{
  border:4px solid #ff9800;
  box-shadow:0 0 20px #ff9800;
}

.sortable-ghost{
  opacity:.5;
  border:4px dashed #f44336;
  background:#fff3e0;
}
.sort-item{
  position:relative;
}

.sort-item::before{
  content:attr(data-index);
  position:absolute;
  top:5px;
  left:5px;
  width:30px;
  height:30px;
  line-height:30px;
  text-align:center;
  background:#1976d2;
  color:#fff;
  border-radius:50%;
  font-weight:bold;
  z-index:10;
}
#sortHint{background:#ffffffcc;border-radius:12px;padding:8px;margin:10px auto;color:#003366;font-weight:bold}.question-list-page{background:#fff;max-width:900px;margin:20px auto;padding:20px;border-radius:15px;text-align:left}rt{font-size:.6em;color:#fff;font-weight:bold}.question-list-page rt{color:#000!important}@media(max-width:768px){h1{font-size:1.5rem}h2{font-size:20px;padding:10px}#questionText{font-size:22px}#quiz{width:95%;padding:15px}button{width:95%;max-width:none;font-size:18px;margin:6px auto;display:block}#scoreBoard{font-size:16px;padding:10px 15px}}
@media(max-width:600px){
    @media(max-width:600px){

  #sortableImages{
    max-width:320px;
  }

  .sort-item{
    padding:5px;

  }

  .sort-item img{
    width:100%;
    max-width:220px;
    height:120px;     /* ← 高さを固定 */
    object-fit:contain;
  }
}
    .home-btn{right:8px;gap:8px}.home-btn a{width:48px;height:48px}.sort-item img{width:150px}}

<h1>特定技能ビルクリーニング試験対策【無料問題集】</h1>
<div class="intro-box"><p id="introText">🌏 外国人向けの特定技能ビルクリーニング試験対策サイトです。<br>📚 ふりがな付きのやさしい日本語で学習できます。<br>🧹 清掃用具・安全衛生・ホテル清掃・ベッドメイキングを無料で勉強できます。</p></div>
<div class="container">
<div id="scoreBoard"><div id="count"></div>score：<span id="score">0</span>　miss：<span id="miss">0</span></div>
<div id="start"><h2>セットを<ruby>選<rt>えら</rt></ruby>んでください</h2><br><button id="start40" onclick="startQuiz(1)">
    <ruby>全問<rt>ぜんもん</rt></ruby>スタート</button><button id="test30" class="random-btn" onclick="startQuiz(5)">TEST✏30<ruby>問<rt>もん</rt></ruby></button><button onclick="showQuestionList()">📚 <ruby>問題一覧<rt>もんだいいちらん</rt></ruby>（こたえあり）</button><br><h2>2択クイズ</h2><br><button onclick="startQuizData2()">🧹 2択クイズ○×<ruby>全問<rt>ぜんもん</rt></ruby>スタート</button><button onclick="startQuizData2Test()">📝 2択クイズ TEST30問</button><button onclick="showQuestionListOX()">📚 2択クイズ○×<ruby>問題一覧<rt>もんだいいちらん</rt></ruby>（こたえあり）</button><br><h2>画像並べ替えクイズ</h2><br><button onclick="startSortQuiz()">🖼️ 画像並べ替えクイズ</button></div>
<div id="quiz" style="display:none"><div id="questionText"></div><img id="toolImage" width="400"><div id="choices"></div><div id="result"></div>
<button id="next" onclick="nextQuestion()">次の問題</button><button id="nextSet" onclick="goNextSet()" style="display:none">次のセットへ進む</button></div><button onclick="goHome()">RESET</button></div>
<div class="home-btn"><a href="index.html">🏠<span>TOP</span></a><a href="birukuri_word_home.html">📚<span>単語</span></a><a href="#top">↑<span>上へ</span></a></div>
<script src="js/QuizData.js"></script>
<script src="js/QuizData1.js"></script>

<script src="js/QuizData2.js"></script>
<script>
let oxTestMode=false,score=0,miss=0,currentQuizData=allQuizData,quizData=[...allQuizData],currentSet=1,current=0,reviewMode=false,sortCurrent=0,sortData=[],sortAnswered=false;

let wrongQuestions={1:[],2:[],3:[],4:[],5:[]};
const imageQuizData=allQuizData.filter(q=>q.image&&!['1','2','3','4','A','B','C','D','PH0','PH3','PH4','PH6','PH8','PH14'].includes(q.answer));
function startSortQuiz(){if(typeof sortQuizData==='undefined'||!sortQuizData.length){alert('sortQuizData が読み込まれていません。');return}sortData=[...sortQuizData];sortCurrent=0;sortAnswered=false;document.getElementById('start').style.display='none';document.getElementById('quiz').style.display='block';document.getElementById('scoreBoard').style.display='none';loadSortQuiz()}
function loadSortQuiz(){const q=sortData[sortCurrent];if(!q){finishSortQuiz();return}sortAnswered=false;document.getElementById('questionText').innerHTML=q.question||'';document.getElementById('toolImage').style.display='none';document.getElementById('result').innerHTML='';document.getElementById('next').style.display='none';let a=q.images.map((img,index)=>({img,index}));for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}let html='<div id="sortHint">🖐️ 画像をドラッグして、正しい順番に並べてください。</div><div id="sortableImages">';a.forEach(x=>{html+=`<div class="sort-item" data-index="${x.index}"><img src="${x.img}" draggable="false"></div>`});html+='</div><button id="sortCheckButton" onclick="checkSortAnswer()">こたえあわせ</button>';document.getElementById('choices').innerHTML=html;enableSort()}
function enableSort(){const el=document.getElementById('sortableImages');if(!el)return;if(typeof Sortable==='undefined'){alert('SortableJSが読み込まれていません。');return}new Sortable(el,{animation:150,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen'})}
function checkSortAnswer(){if(sortAnswered)return;const q=sortData[sortCurrent];const order=[...document.querySelectorAll('#sortableImages .sort-item')].map(x=>Number(x.dataset.index));if(JSON.stringify(order)===JSON.stringify(q.answer)){sortAnswered=true;document.getElementById('result').innerHTML='🎉 正解！';showCorrectEffect();document.getElementById('sortCheckButton').disabled=true;document.getElementById('next').style.display='inline-block'}else{document.getElementById('result').innerHTML='❌ 不正解！<br>もう一度並べ替えてください。'}}
function finishSortQuiz(){sortData=[];sortCurrent=0;sortAnswered=false;document.getElementById('choices').innerHTML='';document.getElementById('result').innerHTML='🏆 画像並べ替えクイズ 全問題終了！';document.getElementById('next').style.display='none';document.getElementById('quiz').style.display='none';document.getElementById('start').style.display='block';document.getElementById('scoreBoard').style.display='block'}
function makeChoices(q){let c=[q.answer];while(c.length<4){let r=imageQuizData[Math.floor(Math.random()*imageQuizData.length)].answer;if(!c.includes(r))c.push(r)}return c.sort(()=>Math.random()-.5)}
function startQuiz(set){score=0;miss=0;currentSet=set;wrongQuestions[currentSet]=wrongQuestions[currentSet]||[];document.getElementById('score').textContent=0;document.getElementById('miss').textContent=0;document.getElementById('start').style.display='none';document.getElementById('quiz').style.display='block';document.getElementById('scoreBoard').style.display='block';quizData=[...currentQuizData];for(let i=quizData.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[quizData[i],quizData[j]]=[quizData[j],quizData[i]]}if(set===5)quizData=quizData.slice(0,30);current=0;reviewMode=false;loadQuiz()}
function startQuizData2(){currentQuizData=quizData2;score=0;miss=0;quizData=[...quizData2];current=0;oxTestMode=false;document.getElementById('score').textContent=0;document.getElementById('miss').textContent=0;document.getElementById('start').style.display='none';document.getElementById('quiz').style.display='block';document.getElementById('scoreBoard').style.display='block';loadQuiz()}
function startQuizData2Test(){startQuizData2();for(let i=quizData.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[quizData[i],quizData[j]]=[quizData[j],quizData[i]]}quizData=quizData.slice(0,30);oxTestMode=true;current=0;loadQuiz()}
function loadQuiz(){const q=quizData[current];if(!q)return;document.getElementById('result').textContent='';document.getElementById('next').style.display='none';document.getElementById('toolImage').style.display=q.image?'block':'none';if(q.image)document.getElementById('toolImage').src=q.image;document.getElementById('questionText').innerHTML=q.question||'';document.getElementById('count').textContent=(current+1)+' / '+quizData.length;const area=document.getElementById('choices');area.innerHTML='';(q.choices||makeChoices(q)).forEach(choice=>{const b=document.createElement('button');b.innerHTML=choice;b.onclick=()=>{if(b.disabled)return;if(choice===q.answer){score++;document.getElementById('result').textContent='🎉 正解！';showCorrectEffect()}else{miss++;document.getElementById('result').innerHTML='× 不正解！ 正解は「'+q.answer+'」';wrongQuestions[currentSet]=wrongQuestions[currentSet]||[];if(!wrongQuestions[currentSet].includes(q))wrongQuestions[currentSet].push(q)}document.getElementById('score').textContent=score;document.getElementById('miss').textContent=miss;document.querySelectorAll('#choices button').forEach(x=>x.disabled=true);document.getElementById('next').style.display='inline-block'};area.appendChild(b)})}
function nextQuestion(){if(sortData.length>0){sortCurrent++;if(sortCurrent>=sortData.length){finishSortQuiz();return}loadSortQuiz();return}current++;if(current>=quizData.length){if(reviewMode){reviewMode=false;document.getElementById('choices').innerHTML='';document.getElementById('result').textContent='復習終了！';document.getElementById('next').style.display='none';document.getElementById('nextSet').style.display='inline-block';return}if(oxTestMode){document.getElementById('choices').innerHTML='';document.getElementById('result').innerHTML='🏆 2択クイズ終了！<br>'+quizData.length+'点中 '+score+' 点でした。';document.getElementById('next').style.display='none';oxTestMode=false;return}if(currentSet===5){document.getElementById('choices').innerHTML='';document.getElementById('result').innerHTML='🏆 テスト30問終了！<br>30点中 '+score+' 点でした。';document.getElementById('next').style.display='none';return}if(wrongQuestions[currentSet]?.length){quizData=wrongQuestions[currentSet];wrongQuestions[currentSet]=[];current=0;reviewMode=true;loadQuiz();return}document.getElementById('choices').innerHTML='';document.getElementById('result').textContent='セット'+currentSet+'終了！';document.getElementById('next').style.display='none';document.getElementById('nextSet').style.display='inline-block';return}loadQuiz()}
function goNextSet(){currentSet++;if(currentSet===2)quizData=currentQuizData.slice(50,100);else if(currentSet===3)quizData=allQuizData.slice(100,150);else if(currentSet===4)quizData=allQuizData.slice(150);else{alert('全セット終了です！');goHome();return}current=0;reviewMode=false;document.getElementById('nextSet').style.display='none';loadQuiz()}
function goHome(){sortData=[];sortCurrent=0;sortAnswered=false;document.getElementById('quiz').style.display='none';document.getElementById('start').style.display='block';document.getElementById('scoreBoard').style.display='block';current=0;currentSet=1;reviewMode=false;oxTestMode=false;wrongQuestions={1:[],2:[],3:[],4:[],5:[]};document.getElementById('count').textContent='';document.getElementById('choices').innerHTML='';document.getElementById('result').textContent=''}
function showCorrectEffect(){const marks=['🔶','✨','🤩','⭐','🔷','💚','💜'];for(let i=0;i<25;i++){const e=document.createElement('div');e.className='fall-emoji';e.textContent=marks[Math.floor(Math.random()*marks.length)];e.style.left=Math.random()*innerWidth+'px';e.style.animationDuration=(Math.random()*2+2)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4000)}}
function showQuestionList(){document.getElementById('start').style.display='none';let html='<div class="question-list-page"><h2>📚 問題一覧</h2>';currentQuizData.forEach((q,i)=>{html+=`<div style="margin-bottom:20px;padding:10px;border-bottom:1px solid #ccc"><b>${i+1}.</b><br><br>`+(q.image?`<img src="${q.image}" style="max-width:150px;width:100%"><br><br>`:'')+(q.question||'')+'<br><br><span style="color:red;font-weight:bold">正解：'+q.answer+'</span><br><br>'+(q.choices?q.choices.map(c=>'・'+c).join('<br>'):'')+'</div>'});html+='<button class="floating-close-btn" onclick="closeQuestionList()">← もどる</button></div>';document.querySelector('.container').innerHTML=html}
function showQuestionListOX(){currentQuizData=quizData2;document.getElementById('start').style.display='none';let html='<div class="question-list-page"><h2>📚 ○×問題一覧</h2>';quizData2.forEach((q,i)=>{html+=`<div style="margin-bottom:20px;padding:10px;border-bottom:1px solid #ccc"><b>${i+1}.</b><br><br>`+(q.image?`<img src="${q.image}" style="max-width:250px;width:100%"><br><br>`:'')+(q.question||'')+'<br><br>'+(q.choices?q.choices.map(c=>'・'+c).join('<br>')+'<br><br>':'')+'<span style="color:red;font-weight:bold">正解：'+q.answer+'</span></div>'});html+='<button class="floating-close-btn" onclick="closeQuestionList()">← もどる</button></div>';document.querySelector('.container').innerHTML=html}
function closeQuestionList(){location.reload()}
document.addEventListener('DOMContentLoaded',()=>{const s=document.querySelector('.bubble-background');setInterval(()=>{const b=document.createElement('span');b.className='bubble';const n=Math.random()*41+10;b.style.width=n+'px';b.style.height=n+'px';b.style.left=Math.random()*innerWidth+'px';s.appendChild(b);setTimeout(()=>b.remove(),8000)},1200)});
</script>
