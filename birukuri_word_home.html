<style>
    html {
    scroll-behavior: smooth;
}
    /* 単語の画像枠 */
.word-image-box{
    width:100%;
    height:180px;
    margin:12px 0 18px;
    background:linear-gradient(135deg,#e8faff,#f7ffff);
    border:3px dashed #69dce9;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
}

/* 画像 */
.word-image-box img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    margin:0;
}
/* 右側のボタン全体 */
.home-btn{
    position: fixed;
    top: 50%;
    right: 18px;

    transform: translateY(-50%);

    display: flex;
    flex-direction: column;
    gap: 12px;

    z-index: 9999;
}

/* 丸いボタン */
.home-btn a{
    width: 58px;
    height: 58px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
        135deg,
        #00bcd4,
        #2196f3
    );

    color: white;

    border-radius: 50%;

    text-decoration: none;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.25);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

/* アイコン */
.home-btn a{
    font-size: 22px;
    font-weight: bold;
}

/* TOP・上へ */
.home-btn a span{
    font-size: 10px;
    line-height: 1;
    margin-top: 2px;
}

/* マウスを乗せたとき */
.home-btn a:hover{
    transform: scale(1.12);
    box-shadow:
        0 8px 22px rgba(0,0,0,0.3);
}

/* 押したとき */
.home-btn a:active{
    transform: scale(0.95);
}
/* 画像がないとき */
.image-placeholder{
    color:#69aebb;
    font-size:15px;
    font-weight:bold;
}

.image-placeholder span{
    display:block;
    font-size:42px;
    margin-bottom:5px;
}

/* =========================
   表示処理
========================= */

const grid = document.getElementById("wordGrid");
const search = document.getElementById("search");
const count = document.getElementById("count");
const empty = document.getElementById("empty");
const categoriesBox = document.getElementById("categories");

let selectedCategory = "すべて";

const categories = [
    "すべて",
    "基本",
    "清掃場所",
    "清掃道具",
    "洗剤・薬剤",
    "作業動詞",
    "安全"
];

function makeRuby(word, ruby) {
    return `<ruby>${word}<rt>${ruby}</rt></ruby>`;
}

function renderCategories() {
    categoriesBox.innerHTML = categories.map(category => `
        <button
            class="category-btn ${category === selectedCategory ? "active" : ""}"
            onclick="selectCategory('${category}')">
            ${category}
        </button>
    `).join("");
}

function selectCategory(category) {
    selectedCategory = category;
    renderCategories();
    renderWords();
}

function renderWords() {

    const keyword = search.value.trim().toLowerCase();

    const filtered = words.filter(item => {

        const categoryOK =
            selectedCategory === "すべて" ||
            item.category === selectedCategory;

        const searchText =
            (
                item.word +
                item.ruby +
                item.meaning +
                item.example +
                item.category
            ).toLowerCase();

        const searchOK = searchText.includes(keyword);

        return categoryOK && searchOK;
    });

    count.textContent = `${filtered.length}語 / 全${words.length}語`;

    if (filtered.length === 0) {
        grid.innerHTML = "";
        empty.style.display = "block";
        return;
    }

    empty.style.display = "none";

    grid.innerHTML = filtered.map(item => `
        <article class="word-card">

            <div class="category-label">
                ${item.category}
            </div>

            <div class="word">
                ${makeRuby(item.word, item.ruby)}
            </div>

            <div class="reading">
                読み方：${item.ruby}
            </div>
            
            <div class="language english">
                <span class="language-label">🇬🇧 English</span>
                ${item.english || ""}
            </div>
            <div class="language nepali">
                <span class="language-label">🇳🇵 नेपाली</span>
                ${item.nepali || ""}
            </div>

            <div class="meaning-title">
                やさしい意味
            </div>

            <div class="meaning">
                ${item.meaning}
            </div>

            <div class="example">
                <strong>例：</strong>${item.example}
            </div>
<div class="word-image-box">
    ${
        item.image
        ? `<img src="${item.image}" alt="${item.word}">`
        : `<div class="image-placeholder">
              <span>🖼️</span>
              画像
           </div>`
    }
</div>
        </article>
    `).join("");
}

search.addEventListener("input", renderWords);

renderCategories();
renderWords();
